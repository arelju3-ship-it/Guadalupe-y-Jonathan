<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda</title>
    <!-- Nota: Se recomienda corregir este enlace por uno de Google Fonts válido -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <!-- AQUÍ PEGAS TODO TU CÓDIGO CSS (Reemplaza el ejemplo) -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4ece1;
            margin: 0;
            overflow: hidden;
        }

        .envelope-wrapper {
            position: relative;
        }

        /* ==========================================================================
   2. ESTRUCTURA DEL SOBRE
   ========================================================================== */
        .envelope {
            position: relative;
            width: 450px;
            height: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            /* Agregado para que todo el sobre sea clickeable */
        }

        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #f5ede0;
            z-index: 1;
            border-radius: 4px;
        }

        .envelope-front {
            position: absolute;
            width: 0;
            height: 0;
            z-index: 3;
            border-left: 225px solid #fdfbf7;
            border-right: 225px solid #fdfbf7;
            border-top: 150px solid transparent;
            border-bottom: 150px solid #fdfbf7;
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 225px solid transparent;
            border-right: 225px solid transparent;
            border-top: 170px solid #f3ebd9;
            transform-origin: top;
            z-index: 4;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.4s, z-index 0s step-end 0.4s;
        }

        /* ==========================================================================
   3. DETALLES EXTERNOS DEL SOBRE
   ========================================================================== */
        .wax-seal {
            position: absolute;
            top: 145px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #e6b800, #b38f00);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s ease-in-out 0.8s;
        }

        .click-instruction {
            position: absolute;
            top: 205px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: #8a7a78;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            pointer-events: none;
            animation: pulseInstruction 2s infinite ease-in-out;
            transition: opacity 0.3s ease-in-out 0s;
        }

        /* ==========================================================================
   4. CARTA INTERNA
   ========================================================================== */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 410px;
            height: 270px;
            background-color: #fff;
            padding: 15px;
            box-sizing: border-box;
            z-index: 2;
            border-radius: 2px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0s, z-index 0s step-end 0.5s;
        }

        .letter-border {
            border: 2px solid #dfb76c;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #4a3e3d;
        }

        .letter-border h2 {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .letter-border .names {
            font-family: 'Great Vibes', cursive;
            font-size: 36px;
            color: #3d271e;
            margin: 15px 0;
        }

        .letter-border .details {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            line-height: 1.4;
            margin: 5px 0;
            color: #3d271e;
        }

        .letter-border .date {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        /* ==========================================================================
   5. BOTÓN ELEGANTE (Optimizado para <button>)
   ========================================================================== */
        .btn-invitation {
            display: inline-block;
            align-self: center;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            background: linear-gradient(135deg, #b8860b, #e6b800, #b38f00);
            padding: 10px 24px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(184, 134, 11, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;

            /* Reseteos necesarios para la etiqueta <button> */
            border: none;
            cursor: pointer;
        }

        .btn-invitation:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(184, 134, 11, 0.5);
            background: linear-gradient(135deg, #cc991a, #ffd700, #cc991a);
        }

        .btn-invitation:active {
            transform: translateY(0);
        }

        /* ==========================================================================
   6. ESTADOS DE ANIMACIÓN (CUANDO SE ABRE EL SOBRE)
   ========================================================================== */
        .envelope.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0s, z-index 0s step-start 0s;
        }

        .envelope.open .wax-seal {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out 0s;
        }

        .envelope.open .click-instruction {
            opacity: 0;
            transition: opacity 0.2s ease-in-out 0s;
        }

        .envelope.open .letter {
            transform: translateY(-160px);
            z-index: 5;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.4s, z-index 0s step-start 0.4s;
        }

        /* Animación de parpadeo elegante */
        @keyframes pulseInstruction {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div class="envelope-wrapper" id="envelope">
        <div class="envelope">
            <div class="envelope-back"></div>

            <!-- CARTA INTERNA -->
            <div class="letter">
                <div class="letter-border">
                    <h2>Nuestra Boda</h2>
                    <div class="names">Guadalupe & Jonathan</div>

                    

                    <!-- BOTÓN ELEGANTE DE ACCESO -->
                    <a href="invitacion.html" class="btn-invitation" id="invitationLink">Ver Invitación</a>
                </div>
            </div>

            <div class="envelope-front"></div>

            <div class="envelope-flap"></div>
            <div class="wax-seal">⚜️</div>

            <!-- NUEVO: Texto indicativo justo debajo del círculo -->
            <div class="click-instruction" id="clickInstruction">Haz clic para abrir</div>
        </div>
    </div>

    <!-- AQUÍ PEGAS TODO TU CÓDIGO JAVASCRIPT (Reemplaza el ejemplo) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const envelopeWrapper = document.getElementById('envelope');
            const mainEnvelope = envelopeWrapper.querySelector('.envelope');
            const clickInstruction = document.getElementById('clickInstruction');

            // Manejo del clic para abrir y cerrar el sobre
            envelopeWrapper.addEventListener('click', (e) => {
                // Si el usuario hace clic directamente en el botón, permitimos su acción normal
                if (e.target.classList.contains('btn-invitation')) {
                    return;
                }

                // Alterna el estado abierto/cerrado del sobre
                mainEnvelope.classList.toggle('open');

                // Controla la visibilidad de la instrucción "Haz clic para abrir"
                if (mainEnvelope.classList.contains('open')) {
                    if (clickInstruction) {
                        clickInstruction.style.display = 'none';
                    }
                } else {
                    if (clickInstruction) {
                        clickInstruction.style.display = 'block';
                    }
                }
            });
        });

    </script>
</body>

</html>
